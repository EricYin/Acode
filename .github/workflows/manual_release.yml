name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
  
env:
  STORE_FILE_PATH: /tmp/app-release.keystore
  BUILD_JSON_PATH: build.json
  VERSION_LABEL: ${{ 'm' }}
  
jobs: 
  build_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    outputs:
      release_output_url: ${{ steps.gh_release.outputs.url }}

    steps:
      - name: Validate required secrets (Fast Fail If missing on nightly builds)
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_CONTENT }}
          BUILD_JSON_CONTENT: ${{ secrets.BUILD_JSON_CONTENT }}
        run: |
          [ -n "$KEYSTORE_CONTENT" ] && [ -n "$BUILD_JSON_CONTENT" ] || { echo "::error title=Missing secrets::KEYSTORE_CONTENT or BUILD_JSON_CONTENT is missing"; exit 1; }
          
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for tags
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: ${{ (github.ref == 'refs/heads/main' && 'gradle') || '' }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*" # or '18.x' for latest stable
          cache: ${{ (github.ref == 'refs/heads/main' && 'npm') || '' }}

      - name: Compute metadata
        id: meta
        run: |
          GIT_COMMIT="$(git rev-parse HEAD)"
          echo "git_commit=$GIT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "normal_artifact_name=app-normal-$GIT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "fdroid_artifact_name=app-fdroid-$GIT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "FILE_DATE=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV

      - name: Extract base version
        id: base
        run: |
          VERSION=$(grep -oP 'version="\K[0-9.]+' config.xml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compose and set build version in config.xml
        id: version
        run: |
          SUFFIX="$(echo "${{ steps.meta.outputs.git_commit }}" | cut -c1-7)"
          UPDATED="${{ steps.base.outputs.version }}-${{ env.VERSION_LABEL }}.$SUFFIX"
          sed -i "s/version=\"${{ steps.base.outputs.version }}\"/version=\"$UPDATED\"/g" config.xml
          echo "updated_version=$UPDATED" >> "$GITHUB_OUTPUT"
          echo "NORMAL_APK_PATH=/tmp/acode-normal-$UPDATED.apk" >> "$GITHUB_ENV"
          echo "FDROID_APK_PATH=/tmp/acode-fdroid-$UPDATED.apk" >> "$GITHUB_ENV"

      - name: Install deps
        run: |
          npm install
          npm install -g cordova
          npm run setup

      - name: Inject signing files
        run: |
          echo "${{ secrets.KEYSTORE_CONTENT }}" | base64 -d > "${{ env.STORE_FILE_PATH }}"
          echo "${{ secrets.BUILD_JSON_CONTENT }}" | base64 -d > "${{ env.BUILD_JSON_PATH }}"

      - name: Build normal APK
        run: |
          node utils/storage_manager.mjs y
          npm run build paid prod apk
          mv platforms/android/app/build/outputs/apk/release/app-release.apk ${{ env.NORMAL_APK_PATH }}

      - name: Upload normal artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.normal_artifact_name }}
          path: ${{ env.NORMAL_APK_PATH }}

      - name: Build fdroid APK
        run: |
          node utils/storage_manager.mjs y
          npm run build paid prod apk fdroid
          mv platforms/android/app/build/outputs/apk/release/app-release.apk ${{ env.FDROID_APK_PATH }}
          
      - name: Upload fdroid artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.fdroid_artifact_name }}
          path: ${{ env.FDROID_APK_PATH }}
          
      - name: Cleanup signing files
        if: always()
        run: rm -f ${{ env.STORE_FILE_PATH }} ${{ env.BUILD_JSON_PATH }}
      
      - name: Post Build - SHA256 signature computation (output)
        id: sha256
        run: |
          echo "normal_apk_sha256=$(sha256sum ${{ env.NORMAL_APK_PATH }} | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          if [ -f "${{ env.FDROID_APK_PATH }}" ]; then
            echo "fdroid_apk_sha256=$(sha256sum ${{ env.FDROID_APK_PATH }} | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          fi

      - name: Post build summary (Table)
        id: summary
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | ----- |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Version | ${{ steps.version.outputs.updated_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Git Commit | ${{ steps.meta.outputs.git_commit }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Normal APK Artifact Name | ${{ steps.meta.outputs.normal_artifact_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| F-Droid APK Artifact Name | ${{ steps.meta.outputs.fdroid_artifact_name || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Normal APK Artifact SHA256 | ${{ steps.sha256.outputs.normal_apk_sha256 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| F-Droid APK Artifact SHA256 | ${{ steps.sha256.outputs.fdroid_apk_sha256 || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
         
          {
              echo "build_summary<<EOF"
              cat "$GITHUB_STEP_SUMMARY"
              echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create nightly prerelease
        id: gh_release
        uses: softprops/action-gh-release@v3
        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          prerelease: true
          tag_name: ${{ env.FILE_DATE }}-${{ steps.version.outputs.updated_version }}
          name: ${{ env.FILE_DATE }}-${{ steps.version.outputs.updated_version }}
          files: |
            ${{ env.NORMAL_APK_PATH }}
            ${{ env.FDROID_APK_PATH }}
          body: |
            ${{ steps.summary.outputs.build_summary }}

      - name: Post Job summary
        if: always()
        run: |
          echo "| Variable | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| release_output_url | ${{ steps.gh_release.outputs.url || 'N/A' }} |" >> "$GITHUB_STEP_SUMMARY"
    
 
  
